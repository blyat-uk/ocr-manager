[project]
name = "ocr-manager"
version = "1.0.0"
description = "Video OCR crop and brightness configuration tool"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
ocr-manager = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "widgets*"]
